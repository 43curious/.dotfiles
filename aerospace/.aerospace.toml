# ctrl  → workspaces
# alt   → apps
# alt + shift → window management

# --- General ---
start-at-login = true
accordion-padding = 0
[mode.main.binding]

# WORKSPACES — ctrl
ctrl-1 = "workspace 1"
ctrl-2 = "workspace 2"
ctrl-3 = "workspace 3"
ctrl-4 = "workspace 4"
ctrl-5 = "workspace 5"
ctrl-6 = "workspace 6"
ctrl-7 = "workspace 7"


# Move window to workspace
ctrl-shift-1 = "move-node-to-workspace 1"
ctrl-shift-2 = "move-node-to-workspace 2"
ctrl-shift-3 = "move-node-to-workspace 3"
ctrl-shift-4 = "move-node-to-workspace 4"
ctrl-shift-5 = "move-node-to-workspace 5"
ctrl-shift-6 = "move-node-to-workspace 6"
ctrl-shift-7 = "move-node-to-workspace 7"

# WINDOW FOCUS — alt + shift

# Focus
ctrl-j= "focus left"
ctrl-k= "focus right"

# Layout
ctrl-q = "layout tiles"
ctrl-w = "layout accordion"

ctrl-e = 'exec-and-forget SwitchAudioSource -s "iFi (by AMR) HD USB Audio Output"'
ctrl-r = 'exec-and-forget SwitchAudioSource -s "Altavoces del MacBook Pro"'
ctrl-t = 'exec-and-forget ~/.dotfiles/scripts/toggle-tailscale.sh'

## Workspace rules. When X app opens = go to Y workspace.

# Ghostty
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 1']

# Zen
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace 2']

# Calendar
[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['move-node-to-workspace 3']


# Obsidian
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 4']

# Qobuz
[[on-window-detected]]
if.app-id = 'com.qobuz.desktop'
run = ['move-node-to-workspace 5']

# Safari
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 6']

# Logic
[[on-window-detected]]
if.app-id = 'com.apple.mobilelogic'
run = ['move-node-to-workspace 7']
