---
- name: Render every server profile without changing a real machine
  hosts: servers
  connection: local
  gather_facts: false
  tasks:
    - name: Render the Samba configuration
      ansible.builtin.template:
        src: ../roles/server/templates/smb.conf.j2
        dest: "{{ render_dir }}/{{ inventory_hostname }}-smb.conf"
        mode: '0600'

    - name: Render Samba's mount dependencies
      ansible.builtin.template:
        src: ../roles/server/templates/samba-mounts.conf.j2
        dest: "{{ render_dir }}/{{ inventory_hostname }}-mounts.conf"
        mode: '0600'

    - name: Render Bagheera's workload boot service
      ansible.builtin.template:
        src: ../roles/workloads/templates/bagheera-containers.service.j2
        dest: "{{ render_dir }}/dotfiles-containers.service"
        mode: '0600'
      when: dotfiles_workloads | bool
