---
- name: Restore AeroSpace's configuration
  ansible.builtin.copy:
    src: "{{ dotfiles_root }}/aerospace/.aerospace.toml"
    dest: "{{ dotfiles_home }}/.aerospace.toml"
    mode: '0644'
    backup: true

- name: Restore Ghostty's configuration
  ansible.builtin.copy:
    src: "{{ dotfiles_root }}/ghostty/.config/ghostty/"
    dest: "{{ dotfiles_home }}/.config/ghostty/"
    mode: preserve
    directory_mode: '0755'
    backup: true

- name: Load the captured Mac client release
  ansible.builtin.include_vars: "{{ dotfiles_root }}/macos/rex-release.yml"

- name: Check whether Rex is already installed
  ansible.builtin.stat:
    path: /Applications/Rex Beta.app
  register: mac_rex_app

- name: Restore Rex on a fresh Mac
  when:
    - not mac_rex_app.stat.exists
    - not ansible_check_mode
  block:
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: dotfiles-rex-
      register: mac_rex_tmp

    - name: Download the captured Rex client
      ansible.builtin.get_url:
        url: "{{ dotfiles_rex_macos_url }}"
        checksum: "{{ dotfiles_rex_macos_checksum }}"
        dest: "{{ mac_rex_tmp.path }}/Rex.dmg"
        mode: '0600'

    - name: Mount the verified Rex disk image
      ansible.builtin.command:
        argv: [hdiutil, attach, -nobrowse, -readonly, -mountpoint, "{{ mac_rex_tmp.path }}/volume", "{{ mac_rex_tmp.path }}/Rex.dmg"]
      changed_when: true

    - name: Install Rex into Applications
      ansible.builtin.command:
        argv: [ditto, "{{ mac_rex_tmp.path }}/volume/Rex Beta.app", /Applications/Rex Beta.app]
        creates: /Applications/Rex Beta.app
      become: true
  always:
    - name: Detach the installer image
      ansible.builtin.command:
        argv: [hdiutil, detach, "{{ mac_rex_tmp.path }}/volume"]
      when: mac_rex_tmp.path is defined
      changed_when: false
      failed_when: false

    - name: Remove the temporary installer files
      ansible.builtin.file:
        path: "{{ mac_rex_tmp.path }}"
        state: absent
      when: mac_rex_tmp.path is defined

- name: Restore only the captured appearance and keyboard preferences
  ansible.builtin.script:
    cmd: >-
      {{ dotfiles_root }}/macos/preferences.py
      --payload {{ lookup('ansible.builtin.file', dotfiles_root + '/' + dotfiles_macos_preferences) | b64encode }}
      {{ '--check' if ansible_check_mode else '' }}
    executable: /usr/bin/python3
  check_mode: false
  register: mac_preferences_result
  changed_when: (mac_preferences_result.stdout | from_json).changed

- name: Explain the interactive Mac recovery steps
  ansible.builtin.debug:
    msg: Quit and reopen Rex to load its appearance. Restore MDM, licences and Accessibility permissions using docs/recovery.md.
