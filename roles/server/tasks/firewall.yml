---
- name: Enable Fedora's firewall
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  when: ansible_facts.os_family == 'RedHat'
  become: true

- name: Permit SMB only from the declared LAN and Tailscale network
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="445" protocol="tcp" accept'
    zone: "{{ dotfiles_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: ["{{ dotfiles_lan_subnet }}", 100.64.0.0/10]
  when: ansible_facts.os_family == 'RedHat'
  become: true

- name: Preserve SSH access before enabling UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: ansible_facts.os_family == 'Debian'
  become: true

- name: Permit SMB from Hirayama's LAN
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ dotfiles_lan_interface }}"
    from_ip: "{{ dotfiles_lan_subnet }}"
    to_port: '445'
    proto: tcp
  when: ansible_facts.os_family == 'Debian'
  become: true

- name: Permit SMB over Tailscale on Hirayama
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    to_port: '445'
    proto: tcp
  when: ansible_facts.os_family == 'Debian'
  become: true

- name: Enable UFW without resetting existing rules
  community.general.ufw:
    state: enabled
  when: ansible_facts.os_family == 'Debian'
  become: true
