---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Reload Samba
  ansible.builtin.systemd_service:
    name: "{{ server_smb_service }}"
    state: reloaded
  become: true

- name: Restore Samba SELinux labels
  ansible.builtin.command:
    argv: [restorecon, -R, "{{ item.path }}"]
  loop: "{{ dotfiles_mounts }}"
  become: true
  changed_when: true
