---
- name: Verify a restored machine without changing it
  hosts: all
  gather_facts: true
  tasks:
    - name: Check the selected operating system
      ansible.builtin.assert:
        that: ansible_facts.distribution == dotfiles_distribution

    - name: Validate the installed shell configuration
      ansible.builtin.command:
        argv: [zsh, -n, "{{ dotfiles_home }}/.zshrc"]
      changed_when: false
      check_mode: false

    - name: Check the expected data disk UUID at every mount
      ansible.builtin.command:
        argv: [findmnt, -rn, -M, "{{ item.path }}", -S, "UUID={{ item.uuid }}"]
      loop: "{{ dotfiles_mounts }}"
      changed_when: false
      check_mode: false

    - name: Check SSH, Tailscale and Samba on Linux
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - "{{ 'sshd' if ansible_facts.os_family == 'RedHat' else 'ssh' }}"
        - tailscaled
        - "{{ 'smb' if ansible_facts.os_family == 'RedHat' else 'smbd' }}"
      when: ansible_facts.system == 'Linux'
      changed_when: false
      check_mode: false

    - name: Validate the Samba configuration
      ansible.builtin.command: testparm -s
      when: ansible_facts.system == 'Linux'
      changed_when: false
      check_mode: false

    - name: Check the Jellyfin and qBittorrent web interfaces
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 5
      loop: [8096, 8080]
      when: dotfiles_workloads | bool

    - name: Check the Mac's core applications
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/Applications/Rex Beta.app, /Applications/AeroSpace.app, /Applications/Tailscale.app]
      register: dotfiles_mac_apps
      when: ansible_facts.system == 'Darwin'

    - name: Report missing Mac applications
      ansible.builtin.assert:
        that: item.stat.isdir | default(false)
        fail_msg: "Missing {{ item.item }}; run the profile or consult docs/recovery.md."
      loop: "{{ dotfiles_mac_apps.results | default([]) }}"
      when: ansible_facts.system == 'Darwin'
