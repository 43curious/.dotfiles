---
- name: Restore Jon's machines
  hosts: all
  gather_facts: true
  pre_tasks:
    - name: Check the profile matches this operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == dotfiles_distribution
        fail_msg: "Wrong profile: {{ inventory_hostname }} expects {{ dotfiles_distribution }}."
      tags: always
    - name: Keep the current login's home directory intact
      ansible.builtin.assert:
        that:
          - ansible_facts.user_dir == dotfiles_home
        fail_msg: Adjust dotfiles_home to match this account before applying; active home directories are not migrated.
      when: ansible_facts.user_id == dotfiles_user
      tags: always
  roles:
    - role: base
      tags: [system, packages]
    - role: shell
      become: "{{ ansible_facts.user_id != dotfiles_user }}"
      become_user: "{{ dotfiles_user }}"
      tags: [user, shell]
  tasks:
    - name: Restore the work Mac
      ansible.builtin.include_role:
        name: mac
        apply:
          become: "{{ ansible_facts.user_id != dotfiles_user }}"
          become_user: "{{ dotfiles_user }}"
          tags: [mac]
      when: ansible_facts.system == 'Darwin'
      tags: [mac]

    - name: Restore Linux system configuration
      ansible.builtin.include_role:
        name: server
        apply:
          tags: [system, server]
      when: ansible_facts.system == 'Linux'
      tags: [system, server]

    - name: Restore Bagheera's workloads
      ansible.builtin.include_role:
        name: workloads
        apply:
          tags: [system, workloads]
      when: dotfiles_workloads | bool
      tags: [system, workloads]

    - name: Restore Linux desktop preferences
      ansible.builtin.include_role:
        name: desktop
        apply:
          become: "{{ ansible_facts.user_id != dotfiles_user }}"
          become_user: "{{ dotfiles_user }}"
          tags: [user, desktop]
      when: ansible_facts.system == 'Linux'
      tags: [user, desktop]
