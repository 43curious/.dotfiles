---
- name: Capture a reviewable inventory, without credentials
  hosts: all
  gather_facts: true
  vars:
    capture_dir: "{{ dotfiles_root }}/.local/captures/{{ inventory_hostname }}"
  tasks:
    - name: Create an ignored inventory directory on the controller
      ansible.builtin.file:
        path: "{{ capture_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Capture OS and hardware facts without the process environment
      ansible.builtin.copy:
        content: >-
          {{ {'distribution': ansible_facts.distribution,
              'version': ansible_facts.distribution_version,
              'architecture': ansible_facts.architecture,
              'hostname': ansible_facts.hostname,
              'user': dotfiles_user, 'home': dotfiles_home} | to_nice_json }}
        dest: "{{ capture_dir }}/system.json"
        mode: '0600'
      delegate_to: localhost

    - name: List Linux disk identities and mounts
      ansible.builtin.command: lsblk --json -o NAME,SIZE,FSTYPE,LABEL,UUID,MOUNTPOINTS
      register: captured_disks
      changed_when: false
      when: ansible_facts.system == 'Linux'

    - name: Save the disk inventory locally
      ansible.builtin.copy:
        content: "{{ captured_disks.stdout }}\n"
        dest: "{{ capture_dir }}/disks.json"
        mode: '0600'
      delegate_to: localhost
      when: ansible_facts.system == 'Linux'

    - name: Read the declared system files for review
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/fstab, /etc/samba/smb.conf]
      register: captured_files
      when: ansible_facts.system == 'Linux'

    - name: Save the declared system files locally
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ capture_dir }}/{{ item.item | basename }}"
        mode: '0600'
      loop: "{{ captured_files.results | default([]) }}"
      delegate_to: localhost
      when: ansible_facts.system == 'Linux'

    - name: Capture the Mac package inventory
      ansible.builtin.command: /opt/homebrew/bin/brew bundle dump --file=-
      register: captured_brew
      changed_when: false
      when: ansible_facts.system == 'Darwin'

    - name: Save the Mac package inventory locally
      ansible.builtin.copy:
        content: "{{ captured_brew.stdout }}\n"
        dest: "{{ capture_dir }}/Brewfile"
        mode: '0600'
      delegate_to: localhost
      when: ansible_facts.system == 'Darwin'

    - name: Read only the allowed Mac preference keys
      ansible.builtin.script:
        cmd: >-
          {{ dotfiles_root }}/macos/preferences.py
          --payload {{ lookup('ansible.builtin.file', dotfiles_root + '/' + dotfiles_macos_preferences) | b64encode }}
          --capture
        executable: /usr/bin/python3
      register: captured_preferences
      changed_when: false
      when: ansible_facts.system == 'Darwin'
      no_log: true

    - name: Save the selected preferences for review
      ansible.builtin.copy:
        content: "{{ captured_preferences.stdout | from_json | to_nice_json }}\n"
        dest: "{{ capture_dir }}/preferences.json"
        mode: '0600'
      delegate_to: localhost
      when: ansible_facts.system == 'Darwin'
