name: bagheera

services:
  jellyfin:
    # Captured from the running image on 2026-11-16; update deliberately.
    image: jellyfin/jellyfin@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: jellyfin
    user: "1000:1000"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8096:8096/tcp"
    volumes:
      - type: bind
        source: /srv/copper/docker/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /srv/copper/docker/transcode
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: /srv/copper/media
        target: /media
        bind: {create_host_path: false}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
    container_name: qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8080:8080/tcp"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - type: bind
        source: /srv/copper/docker/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /srv/copper/media/_All
        target: /downloads
        bind: {create_host_path: false}
