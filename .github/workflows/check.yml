name: Check dotfiles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned control tools
        run: ./bootstrap
      - name: Install syntax validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh samba-common-bin
      - name: Validate and exercise an isolated user restore twice
        run: ./tests/run
