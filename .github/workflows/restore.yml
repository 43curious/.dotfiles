name: Restore machines
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Machine or fleet
        type: choice
        options: [bagheera, hirayama, kleya, servers, all]
        default: servers
      mode:
        description: Review, apply, or check
        type: choice
        options: [plan, apply, check]
        default: plan
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.profiles.outputs.value }}
    steps:
      - id: profiles
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          case "$PROFILE" in
            servers) echo 'value=["bagheera","hirayama"]' >> "$GITHUB_OUTPUT" ;;
            all) echo 'value=["kleya","bagheera","hirayama"]' >> "$GITHUB_OUTPUT" ;;
            kleya|bagheera|hirayama) printf 'value=["%s"]\n' "$PROFILE" >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
  restore:
    needs: select
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.profiles) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.profile }}
    concurrency:
      group: dotfiles-${{ matrix.profile }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned control tools
        run: ./bootstrap
      - name: Select the private host
        id: host
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          host=$(.venv/bin/python -c 'import os,yaml; d=yaml.safe_load(open("inventory/hosts.yml")); p=os.environ["PROFILE"]; print(next(g["hosts"][p]["ansible_host"] for g in d["all"]["children"].values() if p in g["hosts"]))')
          printf 'name=%s\n' "$host" >> "$GITHUB_OUTPUT"
      - name: Join the tailnet temporarily
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ steps.host.outputs.name }}
      - name: Load the dedicated deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DOTFILES_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
      - name: Run the selected operation
        env:
          PROFILE: ${{ matrix.profile }}
          MODE: ${{ inputs.mode }}
          DOTFILES_BECOME_PASSWORD: ${{ secrets.DOTFILES_BECOME_PASSWORD }}
          DOTFILES_SMB_PASSWORD: ${{ secrets.DOTFILES_SMB_PASSWORD }}
        run: ./dotfiles "$MODE" "$PROFILE" --batch
